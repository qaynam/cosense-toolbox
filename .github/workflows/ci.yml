name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: lint / format / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          # --affected が TURBO_SCM_BASE のコミットと比べるため
          fetch-depth: 0

      # 公開レジストリのバージョンは bun.lock に "" と書かれる。URL があれば別のレジストリから入れたもの
      - name: bun.lock に公開レジストリ以外の URL が無い
        run: |
          ! grep -nE '"https?://[^"]+\.tgz"' bun.lock examples/astro-blog/bun.lock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 依存のキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: turbo のキャッシュ
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: 検査
        run: >-
          bunx turbo run
          lint lint:root format:check format:check:root typecheck test build check:public-types
          --affected
          --continue=dependencies-successful
          --output-logs=errors-only
