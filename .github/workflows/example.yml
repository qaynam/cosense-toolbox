name: example

# example はワークスペースの外で npm の版を使うので、ci.yml (turbo) には入らない。
on:
  pull_request:
    paths:
      - examples/astro-blog/**
      - .github/workflows/example.yml
  push:
    branches: [main]
    paths:
      - examples/astro-blog/**
      - .github/workflows/example.yml

concurrency:
  group: example-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/astro-blog
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
