name: publish

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "packages/ 配下のディレクトリ名"
        required: true
        type: choice
        options: [parser, style]
      dryRun:
        description: "公開せず中身だけ確認する"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: タグからパッケージとバージョンを取り出す
        id: target
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            package='${{ inputs.package }}'
            version=$(jq -r .version "packages/$package/package.json")
          else
            tag='${{ github.ref_name }}'
            package="${tag%%-v*}"
            version="${tag#*-v}"
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$package" >> "$GITHUB_OUTPUT"

      - name: package.json のバージョンとタグが一致するか確かめる
        run: |
          dir='${{ steps.target.outputs.dir }}'
          expected='${{ steps.target.outputs.version }}'
          actual=$(jq -r .version "$dir/package.json")
          if [ "$actual" != "$expected" ]; then
            echo "::error::$dir は $actual だが、タグは $expected を指している"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: 検査
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: 公開する
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          bun run npm:publish '${{ steps.target.outputs.package }}' \
            ${{ inputs.dryRun == true && '--dry-run' || '' }}
