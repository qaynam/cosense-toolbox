name: publish

# packages/ のパッケージは、すべて同じバージョンで一緒に公開する。
#   1. bun run release:version <バージョン> でバージョンを揃え、変えたパッケージの README に「### <バージョン> の変更」を書いてコミットする
#   2. v<バージョン> のタグ (例: v0.1.0-beta.2) を push すると、ここで全部を公開し、GitHub のリリースを作る
# 手で動かすときは、既定で公開せずに中身だけ確かめる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "公開せず中身だけ確認する"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    environment: npm
    permissions:
      # GitHub のリリースを作るため
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # リリースノートの起点にする、前のタグを探すため
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: 検査
        run: |
          bun run lint
          bun run format:check
          bun run typecheck
          bun run test

      # タグから公開するときは、タグのバージョンとパッケージのバージョンが一致しなければ止める (--expect)。
      - name: 公開する
        run: |
          npm --version
          if [ "${{ github.event_name }}" = 'push' ]; then
            bun run release:publish --expect "${GITHUB_REF_NAME#v}"
          else
            bun run release:publish ${{ inputs.dryRun == true && '--dry-run' || '' }}
          fi

      # npm に出せたときだけ作る。手で作ると、公開に失敗したバージョンのリリースが残る。
      # ノートは、各パッケージの README の「### <バージョン> の変更」を上に置き、その下に GitHub が作る PR の一覧を続ける。
      - name: GitHub のリリースを作る
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun tools/release/src/notes.ts "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes ${previous:+--notes-start-tag "$previous"}
