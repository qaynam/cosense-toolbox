name: publish

# `<パッケージ>-v<バージョン>` のタグを打つと、そのパッケージだけを npm に公開する。
# 例: parser-v0.1.0-beta.0 → packages/parser
#
# 手で動かす場合は Actions から dry-run を選べる。実際には公開せず、
# 中身と手順だけを確認できる。
on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'packages/ 配下のディレクトリ名'
        required: true
        type: choice
        options: [parser, style]
      dryRun:
        description: '公開せず中身だけ確認する'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # 手動実行をリポジトリの持ち主だけに限る。
    # write 権限があれば workflow_dispatch を叩けてしまうため。
    if: github.actor == github.repository_owner
    # NPM_TOKEN はこの environment に置く。
    # 承認者を設定しておけば、publish ジョブ以外からは読めなくなる。
    environment: npm
    permissions:
      contents: read
      # npm の OIDC 認証 (trusted publishing) に必要
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: タグからパッケージとバージョンを取り出す
        id: target
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            package='${{ inputs.package }}'
            version=$(jq -r .version "packages/$package/package.json")
          else
            tag='${{ github.ref_name }}'
            package="${tag%%-v*}"
            version="${tag#*-v}"
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$package" >> "$GITHUB_OUTPUT"

      - name: package.json のバージョンとタグが一致するか確かめる
        run: |
          dir='${{ steps.target.outputs.dir }}'
          expected='${{ steps.target.outputs.version }}'
          actual=$(jq -r .version "$dir/package.json")
          if [ "$actual" != "$expected" ]; then
            echo "::error::$dir は $actual だが、タグは $expected を指している"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # trusted publishing は npm 11.5.1 以上と Node 22.14 以上を要求する。
      # ビルドとテストは bun で動かし、npm は publish にだけ使う。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # リリースのビルドはキャッシュを使わない (npm の推奨)
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: 検査
        run: |
          bun run lint
          bun run typecheck
          bun run test

      # npm は OIDC を自動で検出し、無ければ NODE_AUTH_TOKEN に落ちる。
      # trusted publishing を設定するまではトークンが使われる。
      # OIDC で publish した場合、provenance は指定しなくても自動で付く。
      - name: 公開する
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          bun run npm:publish '${{ steps.target.outputs.package }}' \
            ${{ inputs.dryRun == true && '--dry-run' || '' }}
