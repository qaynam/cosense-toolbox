name: release-check

# リリースの PR (release/v<バージョン>) を、マージする前に確かめる。
# 積んだ PR を順にマージしたとき、後の PR が main ではなく先の PR のブランチに入り、
# main に届かないことがあった。main に向いているか、バージョンが揃って npm に出せるか、
# 前のリリースの後にマージした PR がすべて入っているかを見る (tools/release/src/check.ts)。
# main 以外に向けた PR も止めたいので、向け先は絞らない。
on:
  pull_request:

jobs:
  check:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # マージした PR の head は、ブランチを消すと手元に無いので、PR の参照から取ってくる。
      - run: git fetch --tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: リリースの PR を確かめる
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: bun run release:check --base "$BASE" --branch "$BRANCH"
